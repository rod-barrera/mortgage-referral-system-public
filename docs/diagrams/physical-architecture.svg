</text>
<text x="137.5" y="187" font-size="17" font-weight="400" text-anchor="middle" fill="#243B53">
<tspan x="137.5" y="187">Ejecutivo</tspan>
<tspan x="137.5" y="210">Supervisora</tspan>
</text>
<rect x="355" y="132" width="270" height="113" rx="8" fill="#EAF2FA" stroke="#243B53" stroke-width="1.6"/>
<text x="490.0" y="161" font-size="18" font-weight="700" text-anchor="middle" fill="#243B53">
<tspan x="490.0" y="161">Aplicación Java</tspan>
</text>
<text x="490.0" y="187" font-size="17" font-weight="400" text-anchor="middle" fill="#243B53">
<tspan x="490.0" y="187">Spring Boot · Java 21</tspan>
<tspan x="490.0" y="210">Puerto local 8080</tspan>
</text>
<rect x="745" y="132" width="215" height="113" rx="8" fill="#EDF7EE" stroke="#243B53" stroke-width="1.6"/>
<text x="852.5" y="161" font-size="18" font-weight="700" text-anchor="middle" fill="#243B53">
<tspan x="852.5" y="161">PostgreSQL 17.11</tspan>
</text>
<text x="852.5" y="187" font-size="17" font-weight="400" text-anchor="middle" fill="#243B53">
<tspan x="852.5" y="187">Implementado</tspan>
<tspan x="852.5" y="210">Puerto 5432</tspan>
</text>
<path d="M235 188 H352" fill="none" stroke="#243B53" stroke-width="1.8"/>
<text x="295" y="174" font-size="15" font-weight="400" text-anchor="middle" fill="#243B53">
<tspan x="295" y="174">HTTP local</tspan>
</text>
<path d="M625 188 H742" fill="none" stroke="#243B53" stroke-width="1.8"/>
<text x="685" y="174" font-size="15" font-weight="400" text-anchor="middle" fill="#243B53">
<tspan x="685" y="174">JDBC local</tspan>
</text>
