<tspan x="40" y="281">Herramientas verificadas: JDK 21.0.10 y Gradle 8.14.2. Base: mortgage_referrals_eval2.</tspan>
</text>
<rect x="20" y="326" width="960" height="245" rx="12" fill="#FAFCFE" stroke="#243B53" stroke-width="1.5"/>
<text x="40" y="357" font-size="21" font-weight="700" text-anchor="start" fill="#243B53">
<tspan x="40" y="357">Despliegue verificado en Render y Neon</tspan>
</text>
<rect x="40" y="400" width="195" height="113" rx="8" fill="#EAF2FA" stroke="#243B53" stroke-width="1.6"/>
<text x="137.5" y="429" font-size="18" font-weight="700" text-anchor="middle" fill="#243B53">
