<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img">
<title>Arquitectura física local y despliegue en Render y Neon</title>
<desc>Arquitectura física de la aplicación local y del servicio publicado en Render con PostgreSQL en Neon.</desc>
<defs>
  <marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243B53"/></marker>
  <marker id="begin" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8 Z" fill="#243B53"/></marker>
</defs>
<rect width="1000" height="650" fill="white"/>
<g font-family="Arial, sans-serif" fill="#243B53">
<text x="30" y="34" font-size="25" font-weight="700" text-anchor="start" fill="#243B53">
<tspan x="30" y="34">Arquitectura física</tspan>
</text>
<rect x="20" y="58" width="960" height="245" rx="12" fill="#FAFCFE" stroke="#243B53" stroke-width="1.5"/>
<text x="40" y="89" font-size="21" font-weight="700" text-anchor="start" fill="#243B53">
<tspan x="40" y="89">Entorno local Windows</tspan>
</text>
<rect x="40" y="132" width="195" height="113" rx="8" fill="#EAF2FA" stroke="#243B53" stroke-width="1.6"/>
