</text>
<rect x="355" y="400" width="270" height="113" rx="8" fill="#EAF2FA" stroke="#243B53" stroke-width="1.6"/>
<text x="490.0" y="429" font-size="18" font-weight="700" text-anchor="middle" fill="#243B53">
