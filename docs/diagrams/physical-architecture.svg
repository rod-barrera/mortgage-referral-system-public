<tspan x="490.0" y="478">Virginia · puerto 10000</tspan>
</text>
<rect x="745" y="400" width="215" height="113" rx="8" fill="#EDF7EE" stroke="#243B53" stroke-width="1.6"/>
<text x="852.5" y="429" font-size="18" font-weight="700" text-anchor="middle" fill="#243B53">
<tspan x="852.5" y="429">Neon</tspan>
</text>
<text x="852.5" y="455" font-size="17" font-weight="400" text-anchor="middle" fill="#243B53">
<tspan x="852.5" y="455">PostgreSQL 17.11</tspan>
<tspan x="852.5" y="478">8 tablas · rol restringido</tspan>
</text>
<path d="M235 456 H352" fill="none" stroke="#243B53" stroke-width="1.8"/>
<text x="295" y="442" font-size="15" font-weight="400" text-anchor="middle" fill="#243B53">
<tspan x="295" y="442">HTTPS</tspan>
</text>
<path d="M625 456 H742" fill="none" stroke="#243B53" stroke-width="1.8"/>
<text x="685" y="442" font-size="15" font-weight="400" text-anchor="middle" fill="#243B53">
<tspan x="685" y="442">JDBC + TLS</tspan>
</text>
<text x="40" y="549" font-size="16" font-weight="400" text-anchor="start" fill="#243B53">
<tspan x="40" y="549">Acceso por HTTPS y conexión TLS a Neon. Credenciales fuera del código.</tspan>
</text>
<text x="30" y="612" font-size="17" font-weight="400" text-anchor="start" fill="#243B53">
<tspan x="30" y="612">Flujo hipotecario publicado y verificado por HTTPS.</tspan>
</text>
