services:
  - type: web
    name: mortgage-referral-system
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BOOTSTRAP_SUPERVISOR_EMAIL
        sync: false
      - key: BOOTSTRAP_SUPERVISOR_NAME
        sync: false
      - key: BOOTSTRAP_SUPERVISOR_PASSWORD
        sync: false
